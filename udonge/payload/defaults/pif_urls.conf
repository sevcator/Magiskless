# udonge — fingerprint source urls for pif_update.sh
#
# Tried in order; first URL that returns a valid fingerprint wins.
# Supports JSON (pifsync-style) and key=value (pif.conf-style) formats.
#
# the Reisenless app manages these sources through /data/adb/udonge/state.
# Auto-runs on boot via service.sh.
#
# Add your own sources below. Comment out any that stop working.

# pifsync — community-maintained Pixel fingerprint database (JSON)
https://raw.githubusercontent.com/vladrevers/pifsync/main/pif.json

# Chiteroman PlayIntegrityFix profile (JSON, frequently updated)
https://raw.githubusercontent.com/chiteroman/PlayIntegrityFix/main/module/pif.json

# osm0sis PlayIntegrityFork custom profile (JSON)
https://raw.githubusercontent.com/osm0sis/PlayIntegrityFork/main/module/pif.json
