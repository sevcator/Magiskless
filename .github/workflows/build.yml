name: Reisenless Build

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "native/**"
      - "scripts/**"
      - "build.py"
      - "config.prop"
      - ".github/actions/setup/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build native core
        run: ./build.py -vvr native

      - name: Build Reisenless
        run: ./build.py -vvr app

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: reisenless-${{ github.sha }}
          path: out/app-release.apk
          if-no-files-found: error
          compression-level: 9
