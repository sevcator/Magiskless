name: Reisenless Build

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "native/**"
      - "scripts/**"
      - "udonge/**"
      - "build.py"
      - "config.prop"
      - ".github/actions/setup/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build native core
        run: ./build.py -vvr native

      - name: Build Reisenless
        run: ./build.py -vvr app

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk=out/app-release.apk
          test -s "$apk"
          unzip -tq "$apk"
          unzip -p "$apk" assets/udonge.bin > "$RUNNER_TEMP/udonge.bin"
          test -s "$RUNNER_TEMP/udonge.bin"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$aapt"
          badging="$("$aapt" dump badging "$apk")"
          grep -Fq "package: name='io.sevcator.reisenless'" <<< "$badging"
          grep -Fq "application-label:'reisenless'" <<< "$badging"
          sha256sum "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: reisenless-${{ github.sha }}
          path: out/app-release.apk
          if-no-files-found: error
          compression-level: 9
