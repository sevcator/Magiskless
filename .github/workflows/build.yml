name: Reisenless Build

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "native/**"
      - "scripts/**"
      - "udonge/**"
      - "build.py"
      - "config.prop"
      - ".github/actions/setup/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Prepare release signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          REISENLESS_KEYSTORE_BASE64: ${{ secrets.REISENLESS_KEYSTORE_BASE64 }}
          REISENLESS_KEYSTORE_PASSWORD: ${{ secrets.REISENLESS_KEYSTORE_PASSWORD }}
          REISENLESS_KEY_ALIAS: ${{ secrets.REISENLESS_KEY_ALIAS }}
          REISENLESS_KEY_PASSWORD: ${{ secrets.REISENLESS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${REISENLESS_KEYSTORE_BASE64:?missing release keystore}"
          : "${REISENLESS_KEYSTORE_PASSWORD:?missing keystore password}"
          : "${REISENLESS_KEY_ALIAS:?missing key alias}"
          : "${REISENLESS_KEY_PASSWORD:?missing key password}"
          keystore="$RUNNER_TEMP/reisenless-release.p12"
          printf '%s' "$REISENLESS_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          {
            printf '\nkeyStore=%s\n' "$keystore"
            printf 'keyStorePass=%s\n' "$REISENLESS_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$REISENLESS_KEY_ALIAS"
            printf 'keyPass=%s\n' "$REISENLESS_KEY_PASSWORD"
          } >> config.prop

      - name: Build native core
        run: ./build.py -vvr native

      - name: Build Reisenless
        run: ./build.py -vvr app

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk=out/app-release.apk
          test -s "$apk"
          unzip -tq "$apk"
          unzip -p "$apk" assets/udonge.bin > "$RUNNER_TEMP/udonge.bin"
          test -s "$RUNNER_TEMP/udonge.bin"
          unzip -p "$RUNNER_TEMP/udonge.bin" tee/classes.dex > "$RUNNER_TEMP/udonge-tee.dex"
          unzip -p "$RUNNER_TEMP/udonge.bin" tee/daemon > "$RUNNER_TEMP/udonge-tee-daemon"
          grep -aFq '/data/adb/udonge/state' "$RUNNER_TEMP/udonge-tee.dex"
          grep -aFq '/data/adb/udonge/./tee-runtime/libcertgen.so' "$RUNNER_TEMP/udonge-tee.dex"
          ! grep -aFq '/data/adb/tricky_store' "$RUNNER_TEMP/udonge-tee.dex"
          ! grep -aFq '/data/adb/modules/tricky_store' "$RUNNER_TEMP/udonge-tee.dex"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          dexdump="$(find "$ANDROID_HOME/build-tools" -type f -name dexdump -print | sort -V | tail -n 1)"
          test -x "$aapt"
          test -x "$dexdump"
          "$dexdump" -f "$RUNNER_TEMP/udonge-tee.dex" >/dev/null
          grep -Fq 'MODDIR=$1' "$RUNNER_TEMP/udonge-tee-daemon"
          grep -Fq '"$MODDIR" --nice-name=TEESimulator' "$RUNNER_TEMP/udonge-tee-daemon"
          badging="$("$aapt" dump badging "$apk")"
          grep -Fq "package: name='io.sevcator.reisenless'" <<< "$badging"
          grep -Fq "application-label:'reisenless'" <<< "$badging"
          sha256sum "$apk"

      - name: Verify release signature
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk=out/app-release.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          set +e
          certificates="$("$apksigner" verify --verbose --print-certs "$apk" 2>&1)"
          verify_status=$?
          set -e
          printf '%s\n' "$certificates"
          test "$verify_status" -eq 0
          actual="$(sed -nE 's/^(Signer #[0-9]+|V[0-9]+ Signer): certificate SHA-256 digest: ([[:xdigit:]]{64})$/\2/p' <<< "$certificates" | sort -u | tr '[:lower:]' '[:upper:]')"
          expected=64958D8CE215FBC85086ABC294F46AF0F27FC2FF99D113C43CE60693659CE719
          test -n "$actual"
          test "$actual" = "$expected"
          echo "release certificate sha256: $actual"

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: reisenless-${{ github.sha }}
          path: out/app-release.apk
          if-no-files-found: error
          compression-level: 9
